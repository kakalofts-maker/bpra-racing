<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPRA - Balochistan Racing Pigeon Association</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #003366;
            --secondary: #2e8b57;
            --accent: #d9534f;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }
        
        header { background: var(--primary); color: white; text-align: center; padding: 15px; border-bottom: 4px solid #cc9900; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        header img { width: 75px; height: 75px; border-radius: 50%; border: 2px solid #cc9900; object-fit: cover; background: white; }
        header .title-area h1 { font-size: 1.3rem; margin-bottom: 3px; }
        header .title-area p { font-size: 0.85rem; opacity: 0.9; }

        nav { background: #11324d; padding: 10px; text-align: center; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        nav button { background: none; border: 1px solid white; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        nav button.active { background: white; color: var(--primary); font-weight: bold; }
        .install-btn { background: #28a745 !important; border-color: #28a745 !important; font-weight: bold; display: inline-block !important; }

        .container { max-width: 950px; margin: 15px auto; padding: 0 10px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        .race-header { background: #cc0000; color: white; text-align: center; padding: 8px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; font-size: 0.95rem; }
        .race-subinfo { display: flex; justify-content: space-between; background: #eef2f7; padding: 8px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; color: var(--primary); flex-wrap: wrap; gap: 5px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.9rem; }
        
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .row .form-group { flex: 1; min-width: 180px; }
